[package]
name = "horizon-barrel-roll"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Barrel rolls for the elytra: the mouse rolls, the strafe keys steer, the camera banks. A Horizon native mod."
publish = false

# The runtime doubles as the mod's library (its tests) and the module the
# bundle injects into the game; the other files compile only inside it.
[lib]
path = "mixins/barrel_roll/runtime.rs"
